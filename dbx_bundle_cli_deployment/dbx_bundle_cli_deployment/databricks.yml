# This is a Declarative Automation Bundle definition for dbx_bundle_cli_deployment.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_bundle_cli_deployment
  uuid: 79c6aa34-0b95-4bc8-b11d-06c91ddcae6e

include:
  - resources/*.yml

# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

#Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  env:
    description: "the env value will be prefixed in all schemas"
    default: "dev"


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: (dev ${workspace.current_user.short_name})
      source_linked_deployment: false
    workspace:
      host: https://adb-7405611310235533.13.azuredatabricks.net/
  prod:
    mode: production
    workspace:
      host: https://adb-7405611310235533.13.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/shyamal6661@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shyamal6661@outlook.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: shyamal6661@outlook.com
        level: CAN_MANAGE
