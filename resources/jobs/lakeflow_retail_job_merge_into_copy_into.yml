resources:
  jobs:
    lakeflow_retail_job_merge_into_copy_into:
      name: lakeflow_retail_job_merge_into_copy_into
      tasks:
        - task_key: load_customer_raw
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/1. Copy_into_LakeFlow_Jobs_creating_ingest_customers.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_customers_clean
          depends_on:
            - task_key: load_customer_raw
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/3. Merge_Into_LakeFlow_Jobs_creating_customers_enriched.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_customers_silver
          depends_on:
            - task_key: load_customers_clean
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/4. Merge_into_Lakeflow_jobs_creating_silver_customers.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_orders_raw
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/2. Copy_into_LakeFlow_Jobs_creating_ingest_orders.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_orders_cleaned
          depends_on:
            - task_key: load_orders_raw
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/5.Merge_into_Lakeflow_jobs_creating_orders_cleaned_notebook.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_orders_silver
          depends_on:
            - task_key: load_orders_cleaned
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/6.Merge_into_Lakeflow_jobs_creating_orders_silver_notebook_with_dups.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
        - task_key: load_gold_table
          depends_on:
            - task_key: load_customers_silver
            - task_key: load_orders_silver
          notebook_task:
            notebook_path: ../../src/Practice/TT_W21_Databricks_LakeFlow_Jobs/7. Gold_Lakeflow_jobs_create_gold_tables.py
            base_parameters:
              ingest: ingestion_schema
              clean: cleaned
              enriched: silver
              curated: curated
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: bronze
          default: skd_personal_bronze
        - name: silver
          default: skd_personal_silver
        - name: gold
          default: skd_personal_gold
      run_as:
        service_principal_name: 8f11d3f9-4133-44be-bff0-3f643c9f3e0c
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
